<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima @ I/ITSEC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face { font-family: "Atkinson"; src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf"); }
    body { 
      font-family: "Atkinson", sans-serif; 
      background: radial-gradient(at 0% 0%, #0B1120 0, transparent 50%), radial-gradient(at 100% 0%, #001a4d 0, transparent 50%); 
      background-color: #0B1120; 
      color: white;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    .tile-secondary { 
      @apply w-full text-left p-5 rounded-2xl bg-[#1e293b] border border-white/20 shadow-lg active:scale-[0.98] transition-all font-bold text-lg hover:bg-[#334155] text-white;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const dayData = [
      { id: "mon", label: "Mon, Dec 1", events: [
        { time: "10:30 – 12:00 · Room 320A", title: "Tutorial 5: Simulation Building Blocks: Game Engines For Military Use 101", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" },
        { time: "12:45 – 14:15 · Room 310CD", title: "Tutorial 2: Humans vs. AI – Architecting Compound AI", presenters: "Zachary Klinefelter, PhD; Gabriel Ganberg; Adam Fouse, PhD" }
      ]},
      { id: "tue", label: "Tue, Dec 2", events: [
        { time: "13:15 – 14:30 · Exhibit Hall", title: "Wargaming Panel – AI's Impact in M&S", presenters: "Panelist: Svitlana Volkova, PhD" },
        { time: "17:00 – 18:30 · Booth 401", title: "Exhibitor Hospitality at I/ITSEC 2025", presenters: "Join us for light bites and drinks.", highlight: true }
      ]},
      { id: "wed", label: "Wed, Dec 3", events: [
        { time: "08:30 – 10:00 · Room 320B", title: "Paper Session: Innovating Talent Strategies", presenters: "Julia Brown" },
        { time: "13:00 – 16:00 · Room 210A", title: "NTSA Career Fair at I/ITSEC", presenters: "Bella Perault – People Operations", highlight: true }
      ]},
      { id: "thu", label: "Thu, Dec 4", events: [
        { time: "08:30 – 10:00 · Destination Lounge", title: "Speaker Session: Wearables and Human Sensors", presenters: "Speaker: Sylvain Bruni" }
      ]}
    ];

    const techData = [
      { name: "NAUTICAL", summary: "Accelerate training development with GenAI.", details: "Uses RAG and Chain-of-Thought prompting to shorten Speed to the Fleet." },
      { name: "White Cell In A Box", summary: "Portable, data-driven assessment solution.", details: "Captures objective performance data across Live, Virtual, and Constructive environments." },
      { name: "PROPEL", summary: "Tactical Action Officer precision learning.", details: "Provides objective scoring and personalized learning recommendations." },
      { name: "FORCEGEN", summary: "AI-enabled training scenario generation.", details: "Rapidly generates mission-relevant scenarios to reduce development time." }
    ];

    const internRoles = [
      { title: "Scientist Intern", location: "Remote", div: "Performance Augmentation" },
      { title: "Software Engineer Intern", location: "Dayton, OH", div: "Performance Augmentation" },
      { title: "AI Engineer Intern", location: "Remote", div: "Intelligent Analytics" },
      { title: "Graphic Artist Intern", location: "Orlando, FL", div: "Strategic Comms" }
    ];

    const App = () => {
      const [activePanel, setActivePanel] = useState(null);
      const [activeDay, setActiveDay] = useState("mon");

      useEffect(() => {
        let timer = setTimeout(() => setActivePanel(null), 60000);
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setActivePanel(null), 60000); };
        ['click', 'touchstart', 'mousemove'].forEach(ev => window.addEventListener(ev, reset));
        return () => ['click', 'touchstart', 'mousemove'].forEach(ev => window.removeEventListener(ev, reset));
      }, []);

      const Panel = ({ title, isOpen, children }) => (
        <div className={`fixed inset-0 z-50 flex items-end justify-center transition-opacity duration-300 ${isOpen ? 'opacity-100 pointer-events-auto bg-black/80 backdrop-blur-sm' : 'opacity-0 pointer-events-none'}`}>
          <div className={`bg-[#0B1120] w-full max-w-4xl h-[85vh] rounded-t-3xl border-t-4 border-cyan-500 p-8 transform transition-transform duration-300 ${isOpen ? 'translate-y-0' : 'translate-y-full'}`}>
            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
              <h2 className="text-3xl font-black text-cyan-400 uppercase tracking-tighter">{title}</h2>
              <button onClick={() => setActivePanel(null)} className="bg-white/10 px-6 py-2 rounded-full font-bold hover:bg-white/20">Close ✕</button>
            </div>
            <div className="flex-1 overflow-y-auto space-y-4 custom-scroll pr-2">{children}</div>
          </div>
        </div>
      );

      return (
        <main className="min-h-screen p-6 flex flex-col items-center">
          <header className="w-full max-w-4xl flex justify-between items-start mb-8">
            <div>
              <img src="aptima-logo-reversed.png" className="h-10 mb-4" alt="Aptima" />
              <h1 className="text-4xl font-black italic tracking-tighter leading-none">APTIMA @ I/ITSEC</h1>
              <p className="text-cyan-400 font-bold uppercase tracking-widest text-[10px] mt-1">Human-Centered Solutions</p>
            </div>
            <div className="bg-white/10 p-2 rounded-xl border border-white/20 shadow-lg">
              <img src="qr-aptima-website.jpeg" className="w-16 h-16 rounded-lg bg-white p-1" />
            </div>
          </header>

          <div className="w-full max-w-4xl space-y-4">
            <button onClick={() => setActivePanel('events')} className="w-full text-left p-8 rounded-3xl bg-gradient-to-r from-orange-600 to-orange-500 shadow-xl border-t border-white/20 active:scale-[0.98] transition-transform">
              <div className="text-3xl font-black uppercase leading-tight">Daily Events</div>
              <div className="opacity-90 font-medium">Papers, Panels & Demonstrations</div>
            </button>
            
            <div className="grid grid-cols-2 gap-4">
              <button onClick={() => setActivePanel('tech')} className="tile-secondary text-center justify-center">Booth Demos</button>
              <button onClick={() => setActivePanel('intern')} className="tile-secondary text-center justify-center">2026 Internships</button>
            </div>

            <div className="rounded-3xl overflow-hidden border border-white/10 shadow-2xl aspect-video bg-black mt-4 relative">
              <video autoPlay loop muted playsInline className="w-full h-full object-cover opacity-80">
                <source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" />
              </video>
              <div className="absolute bottom-6 right-6 text-right drop-shadow-lg">
                <p className="text-xl font-bold uppercase tracking-tighter">The future of <span className="text-orange-500">RESEARCH</span></p>
                <p className="text-lg font-medium opacity-90">is here</p>
              </div>
            </div>
          </div>

          <Panel title="Daily Schedule" isOpen={activePanel === 'events'}>
            <div className="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
              {dayData.map(d => (
                <button key={d.id} onClick={() => setActiveDay(d.id)} className={`px-6 py-3 rounded-xl font-bold transition-all border ${activeDay === d.id ? 'bg-orange-500 border-orange-400' : 'bg-white/5 border-white/5'}`}>{d.label}</button>
              ))}
            </div>
            {dayData.find(d => d.id === activeDay).events.map((ev, i) => (
              <div key={i} className={`p-6 rounded-2xl border ${ev.highlight ? 'border-orange-500 bg-orange-500/10' : 'border-white/10 bg-white/5'}`}>
                <div className="text-orange-400 font-bold mb-1 tracking-wider uppercase text-xs">{ev.time}</div>
                <div className="text-xl font-bold leading-tight">{ev.title}</div>
                <div className="mt-3 text-sm opacity-60 italic">{ev.presenters}</div>
              </div>
            ))}
          </Panel>

          <Panel title="Booth Demonstrations" isOpen={activePanel === 'tech'}>
            {techData.map((t, i) => (
              <div key={i} className="p-6 rounded-2xl border border-white/10 bg-white/5 mb-4">
                <div className="text-cyan-400 font-black text-2xl mb-1">{t.name}</div>
                <div className="font-bold mb-2 text-white/90">{t.summary}</div>
                <p className="text-sm opacity-70 leading-relaxed">{t.details}</p>
              </div>
            ))}
          </Panel>

          <Panel title="2026 Internships" isOpen={activePanel === 'intern'}>
            {internRoles.map((r, i) => (
              <div key={i} className="p-6 rounded-2xl border border-white/10 bg-white/5 mb-4 flex justify-between items-center">
                <div>
                  <div className="text-cyan-400 text-xs font-bold uppercase mb-1">{r.div}</div>
                  <div className="text-xl font-bold">{r.title}</div>
                </div>
                <div className="text-xs font-bold px-3 py-1 bg-white/10 rounded-full">{r.location}</div>
              </div>
            ))}
          </Panel>
        </main>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
