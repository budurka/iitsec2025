<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima Solutions Kiosk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face { font-family: "Atkinson"; src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf"); }
    
    body { 
      font-family: "Atkinson", sans-serif; 
      background-color: #0B1120; 
      background-image: 
        radial-gradient(at 0% 0%, #0867ec15 0, transparent 50%), 
        radial-gradient(at 100% 0%, #0B1120 0, transparent 50%);
      background-attachment: fixed;
      color: white;
      -webkit-font-smoothing: antialiased;
      /* Optimized global kerning */
      letter-spacing: -0.011em; 
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:active {
      background: rgba(255, 255, 255, 0.1);
      border-color: #06b6d4;
      transform: scale(0.985);
    }

    /* Kerning for high-impact headers */
    .tight-header {
      letter-spacing: -0.05em;
      line-height: 0.9;
    }

    /* Spacing for technical labels */
    .label-spacing {
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const dayData = [
      { id: "mon", label: "Mon, Dec 1", events: [
        { time: "10:30 – 12:00", title: "Tutorial 5: Simulation Building Blocks", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" },
        { time: "12:45 – 14:15", title: "Tutorial 2: Humans vs. AI – Compound AI", presenters: "Zachary Klinefelter, PhD; Gabriel Ganberg; Adam Fouse, PhD" }
      ]},
      { id: "tue", label: "Tue, Dec 2", events: [
        { time: "17:00 – 18:30", title: "Exhibitor Hospitality at I/ITSEC 2025", presenters: "Join us at Booth 401 for light bites and drinks.", highlight: true }
      ]}
    ];

    const techData = [
      { name: "NAUTICAL", summary: "GenAI for accelerated training development.", details: "Uses RAG and Chain-of-Thought prompting to reduce Speed to the Fleet.", status: "Available" },
      { name: "White Cell In A Box", summary: "Portable assessment and AAR solution.", details: "Captures objective performance data across Live, Virtual, and Constructive environments.", status: "Deployed" },
      { name: "PROPEL", summary: "Tactical Action Officer precision learning.", details: "Performance scoring and personalized recommendations for maritime teams.", status: "Coming Soon" }
    ];

    const internRoles = [
      { title: "Scientist Intern", div: "Performance Augmentation", loc: "Remote" },
      { title: "Software Engineer Intern", div: "Performance Augmentation", loc: "Dayton, OH" },
      { title: "AI Engineer Intern", div: "Intelligent Analytics", loc: "Remote" }
    ];

    const App = () => {
      const [activePanel, setActivePanel] = useState(null);
      const [activeDay, setActiveDay] = useState("mon");

      useEffect(() => {
        let timer = setTimeout(() => setActivePanel(null), 60000);
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setActivePanel(null), 60000); };
        ['click', 'touchstart'].forEach(e => window.addEventListener(e, reset));
        return () => ['click', 'touchstart'].forEach(e => window.removeEventListener(ev, reset));
      }, []);

      const Panel = ({ title, isOpen, children }) => (
        <div className={`fixed inset-0 z-50 flex items-end justify-center transition-all duration-500 ${isOpen ? 'opacity-100 bg-black/90 backdrop-blur-md' : 'opacity-0 pointer-events-none'}`}>
          <div className={`bg-[#0B1120] w-full max-w-4xl h-[88vh] rounded-t-[3rem] border-t-2 border-cyan-500/40 p-10 transform transition-transform duration-500 ${isOpen ? 'translate-y-0' : 'translate-y-full'}`}>
            <div className="flex justify-between items-center mb-8 border-b border-white/5 pb-8">
              <h2 className="text-4xl font-black text-white uppercase tight-header italic">/ {title}</h2>
              <button onClick={() => setActivePanel(null)} className="bg-white/5 border border-white/10 px-8 py-3 rounded-full font-bold hover:bg-white/10 transition-colors">Close</button>
            </div>
            <div className="flex-1 overflow-y-auto space-y-6 custom-scroll pr-4">{children}</div>
          </div>
        </div>
      );

      return (
        <main className="min-h-screen p-8 flex flex-col items-center">
          <header className="w-full max-w-4xl flex justify-between items-start mb-14">
            <div className="space-y-3">
              <img src="aptima-logo-reversed.png" className="h-8 mb-4" alt="Aptima" />
              <h1 className="text-5xl font-black tight-header text-white uppercase">Aptima @ I/ITSEC</h1>
              <p className="text-cyan-400 font-bold label-spacing text-[11px] opacity-70">Human-Centered AI Solutions</p>
            </div>
            <div className="glass-card p-4 rounded-2xl border-cyan-500/20">
              <img src="qr-aptima-website.jpeg" className="w-16 h-16 rounded-lg bg-white p-1" />
            </div>
          </header>

          <div className="w-full max-w-4xl space-y-6">
            <button onClick={() => setActivePanel('events')} className="w-full text-left p-12 rounded-[2.5rem] bg-gradient-to-br from-orange-600 to-orange-500 shadow-2xl border-t border-white/20 active:scale-[0.98] transition-all">
              <div className="text-[11px] font-bold label-spacing mb-2 opacity-80 italic">Live Updates →</div>
              <div className="text-5xl font-black uppercase tight-header">Daily Schedule</div>
              <div className="opacity-90 font-medium text-xl mt-4 leading-snug">Papers, Panels & Special Presentations</div>
            </button>
            
            <div className="grid grid-cols-2 gap-6">
              <button onClick={() => setActivePanel('tech')} className="glass-card w-full text-left p-10 rounded-[2.5rem] group">
                <div className="text-cyan-400 text-[10px] font-bold label-spacing mb-3 group-hover:text-cyan-300 transition-all">Hub →</div>
                <div className="text-3xl font-black uppercase tight-header">Booth Demos</div>
              </button>
              <button onClick={() => setActivePanel('intern')} className="glass-card w-full text-left p-10 rounded-[2.5rem] group">
                <div className="text-cyan-400 text-[10px] font-bold label-spacing mb-3 group-hover:text-cyan-300 transition-all">Careers →</div>
                <div className="text-3xl font-black uppercase tight-header">Internships</div>
              </button>
            </div>
            
            <button onClick={() => setActivePanel('under40')} className="glass-card w-full text-left p-10 rounded-[2.5rem] group">
              <div className="text-cyan-400 text-[10px] font-bold label-spacing mb-3 group-hover:text-cyan-300 transition-all">Recognition →</div>
              <div className="text-3xl font-black uppercase tight-header">NTSA Top Under 40</div>
            </button>

            <div className="rounded-[3rem] overflow-hidden border border-white/5 shadow-2xl aspect-video bg-black mt-10 relative">
              <video autoPlay loop muted playsInline className="w-full h-full object-cover opacity-60">
                <source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" />
              </video>
            </div>
          </div>

          <Panel title="Schedule" isOpen={activePanel === 'events'}>
            <div className="flex gap-4 mb-10 overflow-x-auto pb-4 no-scrollbar">
              {dayData.map(d => (
                <button key={d.id} onClick={() => setActiveDay(d.id)} className={`px-12 py-5 rounded-2xl font-bold transition-all border ${activeDay === d.id ? 'bg-orange-500 border-orange-400 shadow-[0_10px_30px_rgba(242,94,41,0.2)]' : 'bg-white/5 border-white/5 hover:bg-white/10'}`}>{d.label}</button>
              ))}
            </div>
            {dayData.find(d => d.id === activeDay).events.map((ev, i) => (
              <div key={i} className={`p-10 rounded-[2.5rem] border ${ev.highlight ? 'border-orange-500 bg-orange-500/10 shadow-lg' : 'border-white/5 bg-white/5'}`}>
                <div className="text-orange-400 font-bold mb-3 label-spacing text-[11px] opacity-80">{ev.time}</div>
                <div className="text-3xl font-black leading-tight mb-4 tracking-tight">{ev.title}</div>
                <div className="text-sm opacity-50 italic font-medium">{ev.presenters}</div>
              </div>
            ))}
          </Panel>

          <Panel title="Solutions" isOpen={activePanel === 'tech'}>
            {techData.map((t, i) => (
              <div key={i} className="glass-card p-10 rounded-[3rem] mb-6 border-white/5 shadow-xl">
                <div className="flex justify-between items-center mb-6">
                  <div className="text-cyan-400 font-black text-4xl tight-header uppercase tracking-tighter">{t.name}</div>
                  <span className="text-[10px] font-bold px-4 py-1.5 rounded-full border border-cyan-500/30 text-cyan-400 uppercase label-spacing">{t.status}</span>
                </div>
                <div className="font-bold mb-4 text-white text-2xl leading-tight tracking-tight">{t.summary}</div>
                <p className="text-md opacity-60 leading-relaxed max-w-3xl">{t.details}</p>
              </div>
            ))}
          </Panel>
        </main>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
