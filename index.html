<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima @ I/ITSEC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face { font-family: "Atkinson"; src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf"); }
    body { 
      font-family: "Atkinson", sans-serif; 
      background: radial-gradient(at 0% 0%, #0B1120 0, transparent 50%), radial-gradient(at 100% 0%, #001a4d 0, transparent 50%); 
      background-color: #0B1120; 
      color: white;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    
    /* Improved Button Visibility */
    .tile-secondary { 
      @apply w-full text-left p-5 rounded-2xl bg-[#1e293b] border border-white/20 shadow-lg active:scale-[0.98] transition-all font-bold text-lg hover:bg-[#334155] text-white;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const dayData = [
      { id: "mon", label: "Mon, Dec 1", events: [{ time: "10:30 – 12:00 · Room 320A", title: "Tutorial 5: Simulation Building Blocks", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" }] },
      { id: "tue", label: "Tue, Dec 2", events: [{ time: "17:00 – 18:30 · Booth 401", title: "Exhibitor Hospitality", presenters: "Light bites and drinks.", highlight: true }] }
    ];

    const techData = [
      { name: "NAUTICAL", summary: "GenAI for training development.", details: "Uses RAG and Chain-of-Thought prompting to shorten speed to the fleet." },
      { name: "White Cell In A Box", summary: "Portable assessment solution.", details: "Captures objective performance data across Live, Virtual, and Constructive environments." }
    ];

    const under40 = [
      { name: "Dr. Samantha Perry", photo: "sam-perry.png", blurb: "Leader in AI-enabled training and human performance research." },
      { name: "Dr. Alexxa Bessey", photo: "alexxa-bessey.png", blurb: "Drives cutting-edge research in team performance and simulation-based evaluation." }
    ];

    const App = () => {
      const [activePanel, setActivePanel] = useState(null);
      const [activeDay, setActiveDay] = useState("mon");

      useEffect(() => {
        let timer = setTimeout(() => setActivePanel(null), 60000);
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setActivePanel(null), 60000); };
        window.addEventListener('click', reset);
        return () => window.removeEventListener('click', reset);
      }, []);

      const Panel = ({ id, title, isOpen, children }) => (
        <div className={`fixed inset-0 z-50 flex items-end justify-center transition-opacity duration-300 ${isOpen ? 'opacity-100 pointer-events-auto bg-black/80 backdrop-blur-sm' : 'opacity-0 pointer-events-none'}`}>
          <div className={`bg-[#0B1120] w-full max-w-4xl h-[85vh] rounded-t-3xl border-t-4 border-cyan-500 p-8 transform transition-transform duration-300 ${isOpen ? 'translate-y-0' : 'translate-y-full'}`}>
            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
              <h2 className="text-3xl font-black text-cyan-400 uppercase tracking-tighter">{title}</h2>
              <button onClick={() => setActivePanel(null)} className="bg-white/10 px-6 py-2 rounded-full font-bold hover:bg-white/20">Close ✕</button>
            </div>
            <div className="flex-1 overflow-y-auto space-y-4 custom-scroll">{children}</div>
          </div>
        </div>
      );

      return (
        <main className="min-h-screen p-6 flex flex-col items-center">
          <header className="w-full max-w-4xl flex justify-between items-start mb-8">
            <div>
              <img src="aptima-logo-reversed.png" className="h-10 mb-4" alt="Aptima" />
              <h1 className="text-4xl font-black italic tracking-tighter leading-none">APTIMA @ I/ITSEC</h1>
              <p className="text-cyan-400 font-bold uppercase tracking-widest text-[10px] mt-1">Human-Centered Solutions</p>
            </div>
            <div className="bg-white/10 p-2 rounded-xl border border-white/20">
              <img src="qr-aptima-website.jpeg" className="w-16 h-16 rounded-lg bg-white p-1" />
            </div>
          </header>

          <div className="w-full max-w-4xl space-y-4">
            <button onClick={() => setActivePanel('events')} className="w-full text-left p-8 rounded-3xl bg-gradient-to-r from-orange-600 to-orange-500 shadow-xl border-t border-white/20 active:scale-[0.98] transition-transform">
              <div className="text-3xl font-black uppercase leading-tight">Daily Events</div>
              <div className="opacity-90 font-medium">Papers, Panels & Demonstrations</div>
            </button>
            
            <div className="grid grid-cols-2 gap-4">
              <button onClick={() => setActivePanel('tech')} className="tile-secondary">Booth Demos</button>
              <button onClick={() => setActivePanel('under40')} className="tile-secondary">Top Under 40</button>
            </div>

            <div className="rounded-3xl overflow-hidden border border-white/10 shadow-2xl aspect-video bg-black mt-4 relative">
              <video autoPlay loop muted playsInline className="w-full h-full object-cover opacity-80">
                <source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" />
              </video>
              <div className="absolute bottom-6 right-6 text-right">
                <p className="text-xl font-bold">The future of <span className="text-orange-500">RESEARCH</span></p>
                <p className="text-lg">is here</p>
              </div>
            </div>
          </div>

          <Panel id="events" title="Daily Events" isOpen={activePanel === 'events'}>
            <div className="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
              {dayData.map(d => (
                <button key={d.id} onClick={() => setActiveDay(d.id)} className={`px-6 py-3 rounded-xl font-bold transition-all ${activeDay === d.id ? 'bg-orange-500' : 'bg-white/5 hover:bg-white/10'}`}>{d.label}</button>
              ))}
            </div>
            {dayData.find(d => d.id === activeDay).events.map((ev, i) => (
              <div key={i} className={`p-6 rounded-2xl border ${ev.highlight ? 'border-orange-500 bg-orange-500/10' : 'border-white/10 bg-white/5'}`}>
                <div className="text-orange-400 font-bold mb-1 tracking-wider uppercase text-sm">{ev.time}</div>
                <div className="text-xl font-bold leading-tight">{ev.title}</div>
                <div className="mt-3 text-sm opacity-60 italic">{ev.presenters}</div>
              </div>
            ))}
          </Panel>

          <Panel id="tech" title="Booth Demonstrations" isOpen={activePanel === 'tech'}>
            {techData.map((t, i) => (
              <div key={i} className="p-6 rounded-2xl border border-white/10 bg-white/5 mb-4">
                <div className="text-cyan-400 font-black text-2xl mb-1">{t.name}</div>
                <div className="font-bold mb-3">{t.summary}</div>
                <p className="text-sm opacity-70 leading-relaxed">{t.details}</p>
              </div>
            ))}
          </Panel>

          <Panel id="under40" title="NTSA Top Under 40" isOpen={activePanel === 'under40'}>
            <div className="grid grid-cols-2 gap-6 pt-2">
              {under40.map((u, i) => (
                <div key={i} className="bg-white/5 p-8 rounded-3xl border border-cyan-500/30 text-center flex flex-col items-center">
                  <div className="w-32 h-32 rounded-full overflow-hidden mb-4 border-4 border-cyan-500 shadow-lg bg-zinc-800">
                    <img src={u.photo} className="w-full h-full object-cover" alt={u.name} />
                  </div>
                  <div className="text-2xl font-black text-cyan-400 mb-2">{u.name}</div>
                  <p className="text-sm opacity-70 leading-relaxed">{u.blurb}</p>
                </div>
              ))}
            </div>
          </Panel>
        </main>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
