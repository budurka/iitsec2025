<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima @ I/ITSEC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face { font-family: "Atkinson"; src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf"); }
    body { font-family: "Atkinson", sans-serif; background: radial-gradient(at 0% 0%, #0B1120 0, transparent 50%), radial-gradient(at 100% 0%, #001a4d 0, transparent 50%); background-color: #0B1120; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    .tile-secondary { @apply w-full text-left p-6 rounded-2xl bg-gradient-to-br from-[#003496] to-[#001a4d] border border-white/10 shadow-lg active:scale-[0.98] transition-transform font-bold text-xl; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const dayData = [
      { id: "mon", label: "Mon, Dec 1", events: [{ time: "10:30 – 12:00 · Room 320A", title: "Tutorial 5: Simulation Building Blocks", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" }] },
      { id: "tue", label: "Tue, Dec 2", events: [{ time: "17:00 – 18:30 · Booth 401", title: "Exhibitor Hospitality", presenters: "Light bites and drinks.", highlight: true }] }
    ];

    const techData = [
      { name: "NAUTICAL", summary: "GenAI for training development.", details: "Uses RAG and Chain-of-Thought prompting." },
      { name: "White Cell In A Box", summary: "Portable assessment solution.", details: "Captures objective performance data." }
    ];

    const under40 = [
      { name: "Dr. Samantha Perry", photo: "sam-perry.png", blurb: "Leader in AI-enabled training and human performance research." },
      { name: "Dr. Alexxa Bessey", photo: "alexxa-bessey.png", blurb: "Drives cutting-edge research in team performance." }
    ];

    const App = () => {
      const [activePanel, setActivePanel] = useState(null);
      const [activeDay, setActiveDay] = useState("mon");

      useEffect(() => {
        let timer = setTimeout(() => setActivePanel(null), 60000);
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setActivePanel(null), 60000); };
        window.addEventListener('click', reset);
        return () => window.removeEventListener('click', reset);
      }, []);

      const Panel = ({ id, title, isOpen, children }) => (
        <div className={`fixed inset-0 z-50 flex items-end justify-center transition-opacity ${isOpen ? 'opacity-100 pointer-events-auto bg-black/80' : 'opacity-0 pointer-events-none'}`}>
          <div className={`bg-[#0B1120] w-full max-w-4xl h-[85vh] rounded-t-3xl border-t-4 border-cyan-500 p-8 transform transition-transform ${isOpen ? 'translate-y-0' : 'translate-y-full'}`}>
            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
              <h2 className="text-3xl font-black text-cyan-400 uppercase tracking-tighter">{title}</h2>
              <button onClick={() => setActivePanel(null)} className="bg-white/10 px-6 py-2 rounded-full font-bold">Close ✕</button>
            </div>
            <div className="flex-1 overflow-y-auto space-y-4 custom-scroll">{children}</div>
          </div>
        </div>
      );

      return (
        <main className="min-h-screen p-6 flex flex-col items-center">
          <header className="w-full max-w-4xl flex justify-between items-start mb-10">
            <div>
              <img src="aptima-logo-reversed.png" className="h-10 mb-4" alt="Aptima" />
              <h1 className="text-4xl font-black italic">APTIMA @ I/ITSEC</h1>
              <p className="text-cyan-400 font-bold uppercase tracking-widest text-[10px]">Human-Centered Solutions</p>
            </div>
            <img src="qr-aptima-website.jpeg" className="w-16 h-16 rounded-lg bg-white p-1" />
          </header>

          <div className="w-full max-w-4xl space-y-4">
            <button onClick={() => setActivePanel('events')} className="w-full text-left p-8 rounded-2xl bg-gradient-to-r from-orange-600 to-orange-500 shadow-xl border-t border-white/20">
              <div className="text-3xl font-black uppercase">Daily Events</div>
              <div className="opacity-90">Papers, Panels & Demonstrations</div>
            </button>
            <div className="grid grid-cols-2 gap-4">
              <button onClick={() => setActivePanel('tech')} className="tile-secondary">Booth Demos</button>
              <button onClick={() => setActivePanel('under40')} className="tile-secondary">Top Under 40</button>
            </div>
            <div className="rounded-2xl overflow-hidden border border-white/10 aspect-video bg-black mt-4">
              <video autoPlay loop muted playsInline className="w-full h-full object-cover">
                <source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" />
              </video>
            </div>
          </div>

          <Panel id="events" title="Daily Events" isOpen={activePanel === 'events'}>
            <div className="flex gap-2 mb-6">{dayData.map(d => (
              <button key={d.id} onClick={() => setActiveDay(d.id)} className={`px-6 py-3 rounded-xl font-bold ${activeDay === d.id ? 'bg-orange-500' : 'bg-white/5'}`}>{d.label}</button>
            ))}</div>
            {dayData.find(d => d.id === activeDay).events.map((ev, i) => (
              <div key={i} className={`p-5 rounded-2xl border ${ev.highlight ? 'border-orange-500 bg-orange-500/10' : 'border-white/10 bg-white/5'}`}>
                <div className="text-orange-400 font-bold mb-1">{ev.time}</div>
                <div className="text-xl font-bold">{ev.title}</div>
              </div>
            ))}
          </Panel>

          <Panel id="under40" title="NTSA Top Under 40" isOpen={activePanel === 'under40'}>
            <div className="grid grid-cols-2 gap-6 pt-4">
              {under40.map((u, i) => (
                <div key={i} className="bg-white/5 p-6 rounded-2xl border border-cyan-500/30 text-center">
                  <img src={u.photo} className="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-cyan-500" alt={u.name} />
                  <div className="text-xl font-black text-cyan-400 mb-2">{u.name}</div>
                  <p className="text-sm opacity-70 leading-relaxed">{u.blurb}</p>
                </div>
              ))}
            </div>
          </Panel>

          <Panel id="tech" title="Booth Demonstrations" isOpen={activePanel === 'tech'}>
            {techData.map((t, i) => (
              <div key={i} className="p-6 rounded-2xl border border-white/10 bg-white/5 mb-4">
                <div className="text-cyan-400 font-black text-2xl mb-1">{t.name}</div>
                <p className="text-sm opacity-70">{t.details}</p>
              </div>
            ))}
          </Panel>
        </main>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
