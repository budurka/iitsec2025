<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima Solutions Kiosk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face { 
      font-family: "Atkinson"; 
      src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf") format("truetype"); 
      font-display: swap;
    }
    
    body { 
      font-family: "Atkinson", sans-serif; 
      background-color: #0B1120; 
      background-image: 
        radial-gradient(at 0% 0%, #0867ec10 0, transparent 50%), 
        radial-gradient(at 100% 0%, #0B1120 0, transparent 50%);
      background-attachment: fixed;
      color: white;
      -webkit-font-smoothing: antialiased;
      overflow: hidden; /* Prevents the main page from scrolling */
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    /* Fixed Kerning: Slightly wider than before to prevent jumbling */
    .brand-header {
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .label-spacing {
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- DATA ---
    const dayData = [
      { id: "mon", label: "Mon, Dec 1", events: [
        { time: "10:30 – 12:00", title: "Tutorial 5: Simulation Building Blocks", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" },
        { time: "12:45 – 14:15", title: "Tutorial 2: Humans vs. AI", presenters: "Zachary Klinefelter, PhD; Gabriel Ganberg; Adam Fouse, PhD" }
      ]},
      { id: "tue", label: "Tue, Dec 2", events: [
        { time: "17:00 – 18:30", title: "Exhibitor Hospitality", presenters: "Booth 401: Food & Drinks", highlight: true }
      ]}
    ];

    const techData = [
      { name: "NAUTICAL", summary: "GenAI Training Development.", status: "Available" },
      { name: "White Cell", summary: "LVC Performance Assessment.", status: "Deployed" },
      { name: "PROPEL", summary: "Precision Learning TAO.", status: "Soon" }
    ];

    const App = () => {
      const [activePanel, setActivePanel] = useState(null);
      const [activeDay, setActiveDay] = useState("mon");

      useEffect(() => {
        let timer = setTimeout(() => setActivePanel(null), 60000);
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setActivePanel(null), 60000); };
        window.addEventListener('click', reset);
        return () => window.removeEventListener('click', reset);
      }, []);

      return (
        <main className="h-screen w-full max-w-5xl mx-auto p-6 flex flex-col justify-between overflow-hidden">
          
          {/* Header - Scaled down for height */}
          <header className="flex justify-between items-center mb-4">
            <div className="space-y-1">
              <img src="aptima-logo-reversed.png" className="h-6 mb-2" alt="Aptima" />
              <h1 className="text-3xl font-black brand-header text-white uppercase">Aptima @ I/ITSEC</h1>
              <p className="text-cyan-400 font-bold label-spacing text-[9px] opacity-70">Human-Centered AI Solutions</p>
            </div>
            <div className="glass-card p-2 rounded-xl">
              <img src="qr-aptima-website.jpeg" className="w-12 h-12 rounded bg-white p-0.5" />
            </div>
          </header>

          {/* Main Layout Grid */}
          <div className="flex-1 flex flex-col gap-4 overflow-hidden">
            
            {/* Primary Schedule Button */}
            <button onClick={() => setActivePanel('events')} className="w-full text-left p-6 rounded-2xl bg-gradient-to-br from-orange-600 to-orange-500 shadow-xl border-t border-white/20 active:scale-95 transition-all">
              <div className="text-[10px] font-bold label-spacing mb-1 opacity-80 italic">Full Schedule →</div>
              <div className="text-3xl font-black uppercase brand-header">Daily Schedule</div>
            </button>
            
            {/* Grid for Demos and Internships */}
            <div className="grid grid-cols-2 gap-4">
              <button onClick={() => setActivePanel('tech')} className="glass-card p-6 rounded-2xl group text-left">
                <div className="text-cyan-400 text-[9px] font-bold label-spacing mb-1 group-hover:text-cyan-300">Hub →</div>
                <div className="text-xl font-black uppercase brand-header">Booth Demos</div>
              </button>
              <button onClick={() => setActivePanel('intern')} className="glass-card p-6 rounded-2xl group text-left">
                <div className="text-cyan-400 text-[9px] font-bold label-spacing mb-1 group-hover:text-cyan-300">Careers →</div>
                <div className="text-xl font-black uppercase brand-header">Internships</div>
              </button>
            </div>
            
            <button onClick={() => setActivePanel('under40')} className="glass-card p-6 rounded-2xl group text-left">
              <div className="text-cyan-400 text-[9px] font-bold label-spacing mb-1">Recognition →</div>
              <div className="text-xl font-black uppercase brand-header">NTSA Top Under 40</div>
            </button>

            {/* Video Section - Fills remaining space */}
            <div className="flex-1 rounded-2xl overflow-hidden border border-white/10 shadow-2xl bg-black relative">
              <video autoPlay loop muted playsInline className="w-full h-full object-cover opacity-60">
                <source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" />
              </video>
            </div>
          </div>

          {/* Modal Panels */}
          {activePanel && (
            <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/80 backdrop-blur-md transition-all">
              <div className="bg-[#0B1120] w-full max-w-4xl h-[90vh] rounded-t-3xl border-t-4 border-cyan-500 p-8 flex flex-col">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-3xl font-black text-cyan-400 uppercase italic">/ {activePanel}</h2>
                  <button onClick={() => setActivePanel(null)} className="bg-white/10 px-6 py-2 rounded-full font-bold">Close</button>
                </div>
                <div className="flex-1 overflow-y-auto custom-scroll pr-2 space-y-4">
                  {/* Render content based on activePanel state */}
                  {activePanel === 'events' && dayData.map(d => (
                    <div key={d.id} className="p-4 bg-white/5 rounded-xl border border-white/10">
                      <div className="font-bold text-orange-400 mb-2">{d.label}</div>
                      {d.events.map((e, idx) => <div key={idx} className="mb-2 text-sm opacity-80">• {e.time}: {e.title}</div>)}
                    </div>
                  ))}
                  {activePanel === 'tech' && techData.map((t, idx) => (
                    <div key={idx} className="p-4 bg-white/5 rounded-xl border border-white/10">
                      <div className="font-bold text-cyan-400">{t.name}</div>
                      <div className="text-xs opacity-60">{t.summary}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </main>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
