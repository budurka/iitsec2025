<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima @ I/ITSEC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* --- THEME & FONTS --- */
    @font-face {
      font-family: "Atkinson Hyperlegible Next";
      src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
    }

    :root {
      --aptima-orange: #FA8A08;
      --aptima-orange-dark: #f25e29;
      --bg-dark: #141417;
      --glass-bg: rgba(20, 20, 23, 0.7);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 20px;
    }

    /* --- BASE RESET --- */
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
    
    body {
      font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      overflow: hidden; 
    }

    /* --- BACKGROUND --- */
    #bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at top, rgba(20, 20, 23, 0.4) 0, rgba(20, 20, 23, 0.95) 70%, #141417 100%);
      z-index: -1;
    }

    /* --- LAYOUT UTILITIES --- */
    .scroll-wrapper {
      height: 100vh;
      width: 100%;
      overflow-y: auto;
      padding: 2vh 5vw;
      -webkit-overflow-scrolling: touch;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      padding-bottom: 4rem;
    }

    /* --- HEADER --- */
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start;
      padding-top: 1rem;
    }
    .header-content { display: flex; flex-direction: column; gap: 0.5rem; }
    .logo { height: 50px; width: auto; display: block; object-fit: contain; align-self: flex-start; }
    .title { margin: 0; font-size: 2.2rem; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; }
    .subtitle { margin: 0; font-size: 1.1rem; opacity: 0.8; font-weight: 400; }

    /* --- QR BADGE --- */
    .qr-badge { 
      background: rgba(0, 0, 0, 0.4); 
      border: 1px solid var(--glass-border); 
      border-radius: 16px; 
      padding: 0.8rem; 
      backdrop-filter: blur(var(--glass-blur)); 
      display: flex; 
      align-items: center; 
      gap: 1rem;
    }
    .qr-img { width: 80px; height: 80px; border-radius: 8px; background: #fff; padding: 4px; display: block; }
    .qr-text { font-size: 0.85rem; max-width: 120px; font-weight: 600; line-height: 1.3; }

    /* --- TILES --- */
    .tile-grid { display: flex; flex-direction: column; gap: 1rem; width: 100%; }
    
    .tile {
      position: relative;
      width: 100%; 
      border-radius: 16px; 
      padding: 2rem; 
      text-align: left; 
      font: inherit; 
      cursor: pointer;
      display: flex; 
      flex-direction: column; 
      gap: 0.3rem;
      color: #ffffff; 
      border: 1px solid var(--glass-border); 
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px); 
      transition: all 0.2s ease;
      overflow: hidden;
    }
    
    /* Hover Effects for Desktop */
    @media (hover: hover) {
      .tile:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.4); }
    }
    .tile:active { transform: scale(0.98); }

    /* Tile Variants */
    .tile.orange { background: linear-gradient(135deg, rgba(242, 94, 41, 0.9), rgba(250, 138, 8, 0.8)); border: none; }
    .tile.purple { background: linear-gradient(135deg, rgba(54, 0, 171, 0.8), rgba(77, 8, 217, 0.8)); border: none; }

    .tile-label { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
    .tile-sub { font-size: 1.05rem; opacity: 0.9; font-weight: 400; }

    /* --- VIDEO WIDGET --- */
    .video-widget { 
      width: 100%; 
      border-radius: 16px; 
      overflow: hidden; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border); 
    }
    .video-widget video { width: 100%; display: block; }

    /* --- MODAL SYSTEM --- */
    .modal-backdrop { 
      position: fixed; inset: 0; 
      background: rgba(0,0,0,0.6); 
      z-index: 100; 
      display: flex; justify-content: center; align-items: flex-end; 
      animation: fadeIn 0.2s forwards;
      backdrop-filter: blur(5px);
    }
    
    .modal-content {
      background: #1a1a1e; 
      width: 100%; 
      max-width: 1000px; 
      height: 85vh; 
      border-radius: 24px 24px 0 0;
      border-top: 1px solid var(--glass-border); 
      box-shadow: 0 -10px 60px rgba(0,0,0,0.9);
      display: flex; 
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .modal-header { 
      padding: 1.5rem 2rem; 
      display: flex; justify-content: space-between; align-items: center; 
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .modal-header h2 { margin: 0; font-size: 1.6rem; }

    .btn-close { 
      background: rgba(255,255,255,0.1); 
      border: none; color: #fff; 
      padding: 0.5rem 1.2rem; 
      border-radius: 50px; 
      font-weight: 600; cursor: pointer; 
    }

    .modal-body { 
      flex: 1; 
      overflow-y: auto; 
      padding: 1.5rem 2rem; 
    }

    /* --- CONTENT CARDS --- */
    .card { 
      background: rgba(255,255,255,0.03); 
      border: 1px solid rgba(255,255,255,0.08); 
      border-radius: 12px; 
      padding: 1.2rem; 
      margin-bottom: 1rem; 
    }
    .card-highlight {
      border: 1px solid var(--aptima-orange);
      background: linear-gradient(to right, rgba(250, 138, 8, 0.1), transparent);
    }
    .badge { 
      display: inline-block; font-size: 0.7rem; font-weight: 800; 
      color: var(--aptima-orange); letter-spacing: 0.05em; 
      text-transform: uppercase; margin-bottom: 0.5rem; 
    }
    
    .text-accent { color: var(--aptima-orange); font-weight: 700; }
    .text-title { font-size: 1.25rem; font-weight: 700; margin: 0.2rem 0; }
    .text-body { font-size: 0.95rem; opacity: 0.85; line-height: 1.5; margin-top: 0.5rem; }

    /* --- TABS --- */
    .tabs { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 5px; }
    .tab { 
      background: transparent; border: 1px solid rgba(255,255,255,0.3); 
      color: #fff; padding: 0.5rem 1.2rem; border-radius: 50px; 
      cursor: pointer; white-space: nowrap; font-size: 1rem; 
      transition: all 0.2s;
    }
    .tab.active { background: var(--aptima-orange); border-color: var(--aptima-orange); color: #000; font-weight: 700; }

    /* --- GRID LAYOUTS --- */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    
    /* --- HONOREE STYLES --- */
    .honoree-card { text-align: center; padding: 2rem; position: relative; margin-top: 1rem; }
    .honoree-img { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--aptima-orange); margin-bottom: 1rem; object-fit: cover; background: #333; }
    .honoree-tag { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #000; color: var(--aptima-orange); border: 1px solid var(--aptima-orange); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }

    /* --- ANIMATIONS --- */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- DATA STORE ---
    const DATA = {
      days: [
        { id: "mon", label: "Mon, Dec 1", events: [
          { time: "10:30 – 12:00 · Room 320A", title: "Tutorial 5: Simulation Building Blocks", type: "Tutorial", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" },
          { time: "12:45 – 14:15 · Room 310CD", title: "Tutorial 2: Humans vs. AI", type: "Tutorial", presenters: "Zachary Klinefelter, PhD; Gabriel Ganberg; Summer Rebensky, PhD" }
        ]},
        { id: "tue", label: "Tue, Dec 2", events: [
          { time: "13:15 – 14:30 · Exhibit Hall", title: "Wargaming Panel – AI's Impact in M&S", type: "Panel", presenters: "Panelist: Svitlana Volkova, PhD" },
          { time: "17:00 – 18:30 · Booth 401", title: "Exhibitor Hospitality at I/ITSEC 2025", type: "Hospitality Event", presenters: "Join us for light bites and a complimentary beer, wine, and seltzer bar.", highlight: true }
        ]},
        { id: "wed", label: "Wed, Dec 3", events: [
          { time: "08:30 – 10:00 · Room 320B", title: "Paper Session: Innovating Talent Strategies", type: "Paper Session", presenters: "Paper: Competency Modeling in the USSF · Julia Brown" },
          { time: "08:30 – 10:00 · Room 320F", title: "Paper Session: Training Strategies", type: "Paper Session", presenters: "Aptima Contributors: Samantha Emerson, PhD; Mark Schroeder-Strong, PhD" },
          { time: "10:30 – 12:00 · Room 320G", title: "Paper Session: Cognitive Crossroads", type: "Paper Session", presenters: "Aptima Contributors: Laura Cassani; Michael Davinroy; Tatiana Toumbeva, PhD" },
          { time: "13:00 – 16:00 · Room 210A", title: "NTSA Career Fair at I/ITSEC", type: "Career Fair", presenters: "Bella Perault – People Operations Generalist", highlight: true },
          { time: "13:30 – 15:00 · Room 320A", title: "Paper Session: The AI Playbook", type: "Paper Session", presenters: "Paper: AI-Driven Generative Models · William Dupree, PhD; Svitlana Volkova, PhD" }
        ]},
        { id: "thu", label: "Thu, Dec 4", events: [
          { time: "08:30 – 10:00 · Dest. Lounge", title: "Speaker Session: Wearables", type: "Speaker Session", presenters: "Speaker: Sylvain Bruni" }
        ]}
      ],
      tech: [
        { name: "NAUTICAL™", summary: "Accelerate training development.", details: "Uses advanced generative AI RAG and Chain-of-Thought prompting to shorten Speed to the Fleet." },
        { name: "White Cell In A Box", summary: "Data-driven assessment & AAR.", details: "Captures objective performance data, unifies mission playback, and digitizes evaluations." },
        { name: "PROPEL", summary: "Tactical Action Officer precision learning.", details: "Provides objective, data-driven performance scoring and personalized learning recommendations." },
        { name: "JITMMA", summary: "Personnel-to-mission matching.", details: "Identifies which available personnel best match mission tasks." },
        { name: "FORCEGEN", summary: "AI-enabled training scenario generation.", details: "Rapidly generates high-quality, mission-relevant scenarios using AI." },
        { name: "AI for Wargaming", summary: "Kinetic and cognitive warfare scenarios.", details: "Delivers doctrinally aligned, TTP-correct scenarios at machine speed." },
        { name: "FitForce", summary: "Scalable fitness training platform.", details: "Deploys scientific strength and conditioning practices." }
      ],
      interns: [
        { division: "Performance Augmentation", title: "Scientist Intern", location: "Remote", summary: "Support the design and evaluation of human performance augmentation systems." },
        { division: "Intelligent Performance", title: "AI Engineer Intern", location: "Remote", summary: "Collaborate on the design of ML models." },
        { division: "Strategic Programs", title: "Program Analyst Intern", location: "Orlando, FL", summary: "Support financial reporting, data tracking, and performance monitoring." },
        { division: "Training & Readiness", title: "Software Engineer Intern", location: "Dayton, OH", summary: "Develop and test software for training and performance assessment systems." }
      ],
      under40: [
        { name: "Dr. Samantha Perry", photo: "sam-perry.png", blurb: "Leader in AI-enabled training and human performance research, guiding one of Aptima’s largest MS&T portfolios." },
        { name: "Dr. Alexxa Bessey", photo: "alexxa-bessey.png", blurb: "Drives cutting-edge research in team performance, AI-enabled training, and simulation-based evaluation." }
      ],
      board: [
        { role: "Scholarships Chair", name: "Janet Spruill" },
        { role: "Deputy Chair, Education", name: "Kara Orvis, PhD" },
        { role: "Tutorial Subcommittee", name: "Ramona Shires, ND; Summer Rebensky, PhD" },
        { role: "Human Performance Committee", name: "Stephanie Fussell, PhD; Summer Rebensky, PhD" }
      ]
    };

    // --- REUSABLE COMPONENTS ---

    const IconClose = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    );

    const Modal = ({ title, isOpen, onClose, children }) => {
      if (!isOpen) return null;
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>{title}</h2>
              <button className="btn-close" onClick={onClose}><IconClose /></button>
            </div>
            <div className="modal-body">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const Tile = ({ label, sub, variant = "purple", onClick }) => (
      <button className={`tile ${variant}`} onClick={onClick}>
        <div className="tile-label">{label}</div>
        <div className="tile-sub">{sub}</div>
      </button>
    );

    const EventCard = ({ time, title, meta, desc, highlight }) => (
      <div className={`card ${highlight ? 'card-highlight' : ''}`}>
        {highlight && <div className="badge">★ Featured</div>}
        {time && <div className="text-accent">{time}</div>}
        <div className="text-title">{title}</div>
        {meta && <div style={{opacity: 0.7, fontSize: '0.9rem'}}>{meta}</div>}
        {desc && <div className="text-body">{desc}</div>}
      </div>
    );

    const Header = () => (
      <header className="header">
        <div className="header-content">
          <img src="aptima-logo-reversed.png" alt="Aptima" className="logo" />
          <div>
            <h1 className="title">APTIMA @ I/ITSEC</h1>
            <p className="subtitle">Explore our events, solutions, and opportunities.</p>
          </div>
        </div>
        <div className="qr-badge">
          <img src="qr-aptima-website.jpeg" alt="QR" className="qr-img" />
          <div className="qr-text">Scan to learn more about Aptima.</div>
        </div>
      </header>
    );

    // --- MAIN APP COMPONENT ---

    const App = () => {
      const [view, setView] = useState(null); // 'events', 'tech', 'intern', 'u40', 'board'
      const [dayId, setDayId] = useState("mon");

      // Idle Timer
      useEffect(() => {
        let timer;
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setView(null), 60000); };
        window.addEventListener('click', reset);
        window.addEventListener('scroll', reset);
        reset();
        return () => { window.removeEventListener('click', reset); window.removeEventListener('scroll', reset); };
      }, []);

      const close = () => setView(null);

      return (
        <>
          <video id="bg-video" autoPlay muted loop playsInline><source src="background.mp4" type="video/mp4" /></video>
          <div className="overlay"></div>

          <div className="scroll-wrapper">
            <div className="container">
              <Header />

              <div className="tile-grid">
                <Tile variant="orange" label="Daily Events" sub="See Aptima's 2025 Papers & Events" onClick={() => setView('events')} />
                <Tile label="Booth Demonstrations" sub="Explore our 7 featured solutions" onClick={() => setView('tech')} />
                <Tile label="2026 Internship Opportunities" sub="Preview open roles for next summer" onClick={() => setView('intern')} />
                <Tile label="NTSA Top Under 40 Awardees" sub="Celebrate Aptima’s I/ITSEC 2025 awardees" onClick={() => setView('u40')} />
                <Tile label="I/ITSEC Volunteers" sub="Recognizing Aptima’s commitment" onClick={() => setView('board')} />
              </div>

              <div className="video-widget">
                <video autoPlay loop muted playsInline><source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" /></video>
              </div>
            </div>
          </div>

          {/* --- MODALS --- */}
          
          <Modal title="Daily Events" isOpen={view === 'events'} onClose={close}>
            <div className="tabs">
              {DATA.days.map(d => (
                <button key={d.id} className={`tab ${dayId === d.id ? 'active' : ''}`} onClick={() => setDayId(d.id)}>{d.label}</button>
              ))}
            </div>
            {DATA.days.find(d => d.id === dayId)?.events.map((e, i) => (
              <EventCard key={i} time={e.time} title={e.title} meta={e.type} desc={e.presenters} highlight={e.highlight} />
            ))}
          </Modal>

          <Modal title="Booth Demonstrations" isOpen={view === 'tech'} onClose={close}>
             {DATA.tech.map((t, i) => (
               <EventCard key={i} title={t.name} highlight={false} time={null} desc={<>{t.summary}<br/><span style={{opacity:0.7}}>{t.details}</span></>} />
             ))}
          </Modal>

          <Modal title="2026 Internship Opportunities" isOpen={view === 'intern'} onClose={close}>
            <div className="card card-highlight">
              <div className="badge">★ JOIN US</div>
              <div className="text-title">NTSA Career Fair at I/ITSEC</div>
              <div className="text-body"><strong>13:00 – 16:00 • Room 210A</strong><br/>Meet Bella Perault to learn about Aptima’s 2026 internships.</div>
            </div>
            {DATA.interns.map((role, i) => (
              <EventCard key={i} time={role.division} title={role.title} meta={role.location} desc={role.summary} />
            ))}
          </Modal>

          <Modal title="NTSA Top Under 40 Awardees" isOpen={view === 'u40'} onClose={close}>
            <div className="grid-2">
              {DATA.under40.map((u, i) => (
                <div key={i} className="card honoree-card">
                  <div className="honoree-tag">★ 2025 HONOREE ★</div>
                  <img src={u.photo} alt={u.name} className="honoree-img" />
                  <div className="text-accent" style={{fontSize: '1.4rem'}}>{u.name}</div>
                  <div className="text-body">{u.blurb}</div>
                </div>
              ))}
            </div>
          </Modal>

          <Modal title="I/ITSEC Volunteers" isOpen={view === 'board'} onClose={close}>
            {DATA.board.map((b, i) => (
              <div key={i} className="card" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <div style={{fontWeight:'500'}}>{b.role}</div>
                <div className="text-accent">{b.name}</div>
              </div>
            ))}
          </Modal>

        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
