<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima @ I/ITSEC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* --- FONTS INTACT --- */
    @font-face {
      font-family: "Atkinson Hyperlegible Next";
      src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }

    /* --- BASE STYLES --- */
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: "Atkinson Hyperlegible Next", sans-serif;
      background-color: #141417;
      color: #ffffff;
      overflow: hidden;
    }

    /* --- BACKGROUND & OVERLAY --- */
    #bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at top, rgba(20, 20, 23, 0.5) 0, rgba(20, 20, 23, 0.92) 65%, #141417 100%);
      z-index: -1;
    }

    /* --- LAYOUT --- */
    .kiosk { display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; height: 100vh; padding: 2vh 0; }
    .kiosk-header { display: flex; justify-content: space-between; align-items: center; width: 90%; max-width: 1000px; padding-top: 1rem; }
    .logo { height: 85px; width: auto; }
    .title-wrap h1 { margin: 0; font-size: 2.4rem; text-transform: uppercase; letter-spacing: 0.02em; }
    .subtitle { margin: 0; font-size: 1.15rem; opacity: 0.9; }

    /* --- TILES --- */
    .layout-container { width: 90%; max-width: 900px; display: flex; flex-direction: column; gap: 4vh; }
    .tile-grid { display: flex; flex-direction: column; gap: 2vh; }
    .tile {
      width: 100%; border-radius: 20px; padding: 2.2rem 2.5rem; text-align: left; font: inherit; cursor: pointer;
      display: flex; flex-direction: column; gap: 0.35rem; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px); transition: transform 0.15s ease-out;
    }
    .tile:active { transform: scale(0.98); filter: brightness(1.1); }
    .btn-orange { background: linear-gradient(135deg, rgba(242, 94, 41, 0.96), rgba(250, 138, 8, 0.92)); }
    .btn-purple { background: linear-gradient(135deg, #3600ab, #4d08d9); }
    .tile-label { font-size: 1.8rem; font-weight: 800; }
    .tile-sub { font-size: 1.15rem; opacity: 0.95; }

    /* --- PANELS --- */
    .panel { position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-end; background: rgba(0,0,0,0.7); z-index: 100; }
    .panel-inner {
      background: rgba(20, 20, 23, 0.98); width: 100%; max-width: 1000px; height: 90vh; border-radius: 24px 24px 0 0;
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 2rem 2.5rem; display: flex; flex-direction: column;
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 0.6rem 1.2rem; border-radius: 50px; cursor: pointer; }

    /* --- CARDS & LISTS --- */
    .events-list { flex: 1; overflow-y: auto; padding-bottom: 2rem; position: relative; }
    .event-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 1.2rem; margin-bottom: 1rem; }
    .event-time { color: #f25e29; font-weight: 700; margin-bottom: 0.3rem; font-size: 1.1rem; }
    .event-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.5rem; }
    .day-tabs { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; }
    .day-tab { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.6rem 1.2rem; border-radius: 50px; cursor: pointer; }
    .day-tab.active { background: #f25e29; border-color: #f25e29; }
    
    .career-banner { border: 2px solid #FA8A08; background: linear-gradient(to bottom right, rgba(250, 138, 8, 0.15), rgba(20, 20, 23, 0.85)); padding: 1.4rem; border-radius: 16px; margin-bottom: 1.5rem; }

    /* --- HONOREE STYLING --- */
    .honoree-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .honoree-card { background: rgba(255,255,255,0.05); border: 1px solid #FA8A08; padding: 2rem; text-align: center; border-radius: 14px; position: relative; }
    .honoree-photo { width: 180px; height: 180px; border-radius: 50%; border: 3px solid #FA8A08; margin-bottom: 1.2rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- FULL DATA ---
    const dayData = [
      { id: "mon", label: "Mon, Dec 1", events: [
        { time: "10:30 – 12:00 · Room 320A", title: "Tutorial 5: Simulation Building Blocks", type: "Tutorial", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" },
        { time: "12:45 – 14:15 · Room 310CD", title: "Tutorial 2: Humans vs. AI", type: "Tutorial", presenters: "Zachary Klinefelter, PhD; Gabriel Ganberg; etc." }
      ]},
      { id: "tue", label: "Tue, Dec 2", events: [
        { time: "17:00 – 18:30 · Booth 401", title: "Exhibitor Hospitality at I/ITSEC 2025", type: "Hospitality", presenters: "Light bites and a complimentary bar.", highlight: true }
      ]},
      { id: "wed", label: "Wed, Dec 3", events: [
        { time: "13:00 – 16:00 · Room 210A", title: "NTSA Career Fair at I/ITSEC", type: "Career Fair", presenters: "Bella Perault – People Operations Generalist", highlight: true }
      ]}
    ];

    const techData = [
      { name: "NAUTICAL", summary: "Accelerate training development.", details: "Uses advanced generative AI RAG and Chain-of-Thought prompting." },
      { name: "White Cell In A Box", summary: "Data-driven assessment and AAR training solution.", details: "Captures objective performance data and unifies mission playback." }
    ];

    const internRoles = [
      { division: "Performance Augmentation Systems", title: "Scientist Intern", location: "Remote", summary: "Support the design and evaluation of human performance systems." },
      { division: "Intelligent Performance Analytics", title: "AI Engineer Intern", location: "Remote", summary: "Collaborate on the design of ML models." }
    ];

    const under40 = [
      { name: "Dr. Samantha Perry", photo: "sam-perry.png", blurb: "Leader in AI-enabled training and human performance research." },
      { name: "Dr. Alexxa Bessey", photo: "alexxa-bessey.png", blurb: "Drives cutting-edge research in team performance and simulation." }
    ];

    const boardMentions = [
      { role: "Scholarships Chair", name: "Janet Spruill" }, 
      { role: "Deputy Chair, Education Subcommittee", name: "Kara Orvis, PhD" }
    ];

    // --- COMPONENTS ---
    const Panel = ({ title, isOpen, onClose, children }) => {
      if (!isOpen) return null;
      return (
        <div className="panel" onClick={onClose}>
          <div className="panel-inner" onClick={e => e.stopPropagation()}>
            <div className="panel-header">
              <h2>{title}</h2>
              <button className="btn-ghost" onClick={onClose}>Close ✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    const App = () => {
      const [activePanel, setActivePanel] = useState(null);
      const [activeDay, setActiveDay] = useState("mon");

      useEffect(() => {
        let timer;
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setActivePanel(null), 60000); };
        window.addEventListener('mousedown', reset);
        reset();
        return () => window.removeEventListener('mousedown', reset);
      }, []);

      return (
        <div className="kiosk-app">
          <video id="bg-video" autoPlay muted loop playsInline><source src="background.mp4" type="video/mp4" /></video>
          <div className="overlay"></div>

          <main className="kiosk">
            <header className="kiosk-header">
              <div className="header-main">
                <img src="aptima-logo-reversed.png" alt="Aptima logo" className="logo" />
                <div className="title-wrap">
                  <h1>APTIMA @ I/ITSEC</h1>
                  <p className="subtitle">Explore our events, solutions, and opportunities.</p>
                </div>
              </div>
              <div className="featured-card-rotator">
                <div style={{display:'flex', gap:'1.2rem', alignItems:'center'}}>
                  <img src="qr-aptima-website.jpeg" alt="QR" className="qr-img-small" />
                  <p className="qr-caption">Scan to learn more about Aptima.</p>
                </div>
              </div>
            </header>

            <section className="layout-container">
              <div className="tile-grid">
                <button className="tile btn-orange" onClick={() => setActivePanel('events')}>
                  <span className="tile-label">Daily Events</span>
                  <span className="tile-sub">See Aptima's 2025 Papers & Events</span>
                </button>
                <button className="tile btn-purple" onClick={() => setActivePanel('tech')}>
                  <span className="tile-label">Booth Demonstrations</span>
                  <span className="tile-sub">Explore our 7 featured solutions</span>
                </button>
                <button className="tile btn-purple" onClick={() => setActivePanel('intern')}>
                  <span className="tile-label">2026 Internship Opportunities</span>
                  <span className="tile-sub">Preview open roles for next summer</span>
                </button>
                <button className="tile btn-purple" onClick={() => setActivePanel('u40')}>
                  <span className="tile-label">NTSA Top Under 40 Awardees</span>
                  <span className="tile-sub">Celebrate Aptima’s I/ITSEC 2025 awardees</span>
                </button>
                <button className="tile btn-purple" onClick={() => setActivePanel('board')}>
                  <span className="tile-label">I/ITSEC Volunteers</span>
                  <span className="tile-sub">Recognizing Aptima’s commitment</span>
                </button>
              </div>

              <div style={{width:'100%', borderRadius:'20px', overflow:'hidden', border:'1px solid rgba(255,255,255,0.15)'}}>
                <video style={{width:'100%', display:'block'}} autoPlay loop muted playsInline>
                  <source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" />
                </video>
              </div>
            </section>
          </main>

          {/* EVENTS PANEL */}
          <Panel title="Daily Events" isOpen={activePanel === 'events'} onClose={() => setActivePanel(null)}>
            <div className="day-tabs">
              {dayData.map(d => (
                <button key={d.id} className={`day-tab ${activeDay === d.id ? 'active' : ''}`} onClick={() => setActiveDay(d.id)}>{d.label}</button>
              ))}
            </div>
            <div className="events-list">
              {dayData.find(d => d.id === activeDay).events.map((e, i) => (
                <div key={i} className="event-card">
                  <div className="event-time">{e.time}</div>
                  <div className="event-title">{e.title}</div>
                  <div style={{opacity:0.9}}>{e.presenters}</div>
                </div>
              ))}
            </div>
          </Panel>

          {/* TECH PANEL */}
          <Panel title="Booth Demonstrations" isOpen={activePanel === 'tech'} onClose={() => setActivePanel(null)}>
            <div className="events-list">
              {techData.map((t, i) => (
                <div key={i} className="event-card">
                  <div className="event-title" style={{color:'#f25e29'}}>{t.name}</div>
                  <div style={{fontWeight:'500', marginBottom:'0.5rem'}}>{t.summary}</div>
                  <div style={{fontSize:'0.95rem', opacity:0.8}}>{t.details}</div>
                </div>
              ))}
            </div>
          </Panel>

          {/* INTERN PANEL */}
          <Panel title="2026 Internship Opportunities" isOpen={activePanel === 'intern'} onClose={() => setActivePanel(null)}>
            <div className="career-banner">
              <h3>NTSA Career Fair at I/ITSEC</h3>
              <p><strong>13:00 – 16:00 • Room 210A</strong></p>
              <p>Meet Bella Perault to learn about Aptima’s 2026 internships.</p>
            </div>
            <div className="events-list">
              {internRoles.map((role, i) => (
                <div key={i} className="event-card">
                  <div className="event-time">{role.division}</div>
                  <div className="event-title">{role.title}</div>
                  <div style={{fontSize:'0.9rem'}}>{role.summary}</div>
                </div>
              ))}
            </div>
          </Panel>

          {/* UNDER 40 PANEL */}
          <Panel title="NTSA Top Under 40 Awardees" isOpen={activePanel === 'u40'} onClose={() => setActivePanel(null)}>
            <div className="honoree-grid">
              {under40.map((u, i) => (
                <div key={i} className="honoree-card">
                   <div style={{position:'absolute', top:'-12px', left:'50%', transform:'translateX(-50%)', background:'#141417', color:'#FA8A08', border:'1px solid #FA8A08', padding:'2px 10px', borderRadius:'50px', fontSize:'0.75rem', fontWeight:'800'}}>★ 2025 HONOREE ★</div>
                   <img src={u.photo} alt={u.name} className="honoree-photo" />
                   <div className="event-title" style={{color:'#FA8A08'}}>{u.name}</div>
                   <div style={{fontSize:'0.9rem', lineHeight:'1.5'}}>{u.blurb}</div>
                </div>
              ))}
            </div>
          </Panel>

          {/* BOARD PANEL */}
          <Panel title="I/ITSEC Volunteers" isOpen={activePanel === 'board'} onClose={() => setActivePanel(null)}>
            <div className="events-list">
              {boardMentions.map((b, i) => (
                <div key={i} className="event-card">
                  <div className="event-title">{b.role}</div>
                  <div style={{color:'#f25e29', fontWeight:'700'}}>{b.name}</div>
                </div>
              ))}
            </div>
          </Panel>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
