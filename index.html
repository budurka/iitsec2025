<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aptima Solutions Kiosk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face { font-family: "Atkinson"; src: url("AtkinsonHyperlegibleNext-VariableFont_wght.ttf"); }
    
    body { 
      font-family: "Atkinson", sans-serif; 
      background-color: #0B1120; 
      /* Gradient style from solutions.aptima.com App.css */
      background-image: 
        radial-gradient(at 0% 0%, #0867ec22 0, transparent 50%), 
        radial-gradient(at 100% 0%, #0B1120 0, transparent 50%);
      background-attachment: fixed;
      color: white;
      -webkit-font-smoothing: antialiased;
    }

    /* Glassmorphism effect from Solutions landing page */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .glass-card:active {
      background: rgba(255, 255, 255, 0.08);
      border-color: #06b6d4;
    }

    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const dayData = [
      { id: "mon", label: "Mon, Dec 1", events: [
        { time: "10:30 – 12:00", title: "Tutorial 5: Game Engines For Military Use 101", presenters: "Stephanie Fussell, PhD; Summer Rebensky, PhD" },
        { time: "12:45 – 14:15", title: "Tutorial 2: Humans vs. AI", presenters: "Zachary Klinefelter, PhD; Gabriel Ganberg; Adam Fouse, PhD" }
      ]},
      { id: "tue", label: "Tue, Dec 2", events: [
        { time: "17:00 – 18:30", title: "Exhibitor Hospitality at I/ITSEC 2025", presenters: "Join us at Booth 401 for light bites and drinks.", highlight: true }
      ]}
    ];

    const techData = [
      { name: "NAUTICAL", summary: "Accelerate training development with GenAI.", details: "Uses RAG and Chain-of-Thought prompting to shorten Speed to the Fleet and reduce costs.", status: "Available Now" },
      { name: "White Cell In A Box", summary: "Portable assessment and AAR solution.", details: "Captures objective performance data across Live, Virtual, and Constructive environments.", status: "In Use: Nellis AFB" },
      { name: "PROPEL", summary: "Tactical Action Officer precision learning.", details: "Data-driven performance scoring and personalized learning recommendations.", status: "Coming Soon" },
      { name: "JITMMA", summary: "Personnel-to-mission matching.", details: "Built for volatile environments where leaders must rapidly reassign tasks.", status: "Alpha" }
    ];

    const internRoles = [
      { title: "Scientist Intern", div: "Performance Augmentation", loc: "Remote" },
      { title: "Software Engineer Intern", div: "Performance Augmentation", loc: "Dayton, OH" },
      { title: "AI Engineer Intern", div: "Intelligent Analytics", loc: "Remote" }
    ];

    const App = () => {
      const [activePanel, setActivePanel] = useState(null);
      const [activeDay, setActiveDay] = useState("mon");

      useEffect(() => {
        let timer = setTimeout(() => setActivePanel(null), 60000);
        const reset = () => { clearTimeout(timer); timer = setTimeout(() => setActivePanel(null), 60000); };
        window.addEventListener('click', reset);
        return () => window.removeEventListener('click', reset);
      }, []);

      const Panel = ({ title, isOpen, children }) => (
        <div className={`fixed inset-0 z-50 flex items-end justify-center transition-all duration-500 ${isOpen ? 'opacity-100 bg-black/80 backdrop-blur-md' : 'opacity-0 pointer-events-none'}`}>
          <div className={`bg-[#0B1120] w-full max-w-4xl h-[85vh] rounded-t-3xl border-t-4 border-cyan-500 p-8 transform transition-transform duration-500 ${isOpen ? 'translate-y-0' : 'translate-y-full'}`}>
            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-6">
              <h2 className="text-3xl font-black text-cyan-400 uppercase tracking-tighter">{title}</h2>
              <button onClick={() => setActivePanel(null)} className="bg-white/10 px-8 py-3 rounded-full font-bold hover:bg-white/20">Close ✕</button>
            </div>
            <div className="flex-1 overflow-y-auto space-y-4 custom-scroll pr-4">{children}</div>
          </div>
        </div>
      );

      return (
        <main className="min-h-screen p-8 flex flex-col items-center">
          <header className="w-full max-w-4xl flex justify-between items-start mb-12">
            <div>
              <img src="aptima-logo-reversed.png" className="h-10 mb-6" alt="Aptima" />
              <h1 className="text-5xl font-black tracking-tighter leading-none text-white">APTIMA @ I/ITSEC</h1>
              <p className="text-cyan-400 font-bold uppercase tracking-[0.3em] text-[12px] mt-2">Human-Centered Solutions</p>
            </div>
            <div className="glass-card p-4 rounded-3xl">
              <img src="qr-aptima-website.jpeg" className="w-20 h-20 rounded-xl bg-white p-1" />
            </div>
          </header>

          <div className="w-full max-w-4xl space-y-6">
            {/* Primary Action Button */}
            <button onClick={() => setActivePanel('events')} className="w-full text-left p-10 rounded-[2rem] bg-gradient-to-br from-orange-600 to-orange-500 shadow-2xl border-t border-white/20 active:scale-[0.98] transition-all">
              <div className="text-4xl font-black uppercase tracking-tighter">Daily Schedule</div>
              <div className="opacity-90 font-medium text-xl mt-1 italic">Papers, Panels & Special Events</div>
            </button>
            
            {/* Button Grid - Fixed Layout */}
            <div className="grid grid-cols-2 gap-6">
              <button onClick={() => setActivePanel('tech')} className="glass-card w-full text-left p-8 rounded-[2rem] flex flex-col group">
                <span className="text-cyan-400 text-sm font-bold uppercase tracking-widest mb-2 group-hover:translate-x-1 transition-transform">Solutions Hub →</span>
                <span className="text-2xl font-black uppercase tracking-tighter">Booth Demos</span>
              </button>
              <button onClick={() => setActivePanel('intern')} className="glass-card w-full text-left p-8 rounded-[2rem] flex flex-col group">
                <span className="text-cyan-400 text-sm font-bold uppercase tracking-widest mb-2 group-hover:translate-x-1 transition-transform">Careers →</span>
                <span className="text-2xl font-black uppercase tracking-tighter">Internships</span>
              </button>
            </div>
            
            <button onClick={() => setActivePanel('under40')} className="glass-card w-full text-left p-8 rounded-[2rem] flex flex-col group">
              <span className="text-cyan-400 text-sm font-bold uppercase tracking-widest mb-2 group-hover:translate-x-1 transition-transform">Recognition →</span>
              <span className="text-2xl font-black uppercase tracking-tighter">NTSA Top Under 40</span>
            </button>

            {/* Video Section */}
            <div className="rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl aspect-video bg-black mt-6">
              <video autoPlay loop muted playsInline className="w-full h-full object-cover opacity-80">
                <source src="Aptima Intro-Promo Oct 2025.mp4" type="video/mp4" />
              </video>
            </div>
          </div>

          <Panel title="Schedule" isOpen={activePanel === 'events'}>
            <div className="flex gap-3 mb-8 overflow-x-auto pb-2 no-scrollbar">
              {dayData.map(d => (
                <button key={d.id} onClick={() => setActiveDay(d.id)} className={`px-8 py-4 rounded-2xl font-bold transition-all border ${activeDay === d.id ? 'bg-orange-500 border-orange-400 shadow-lg' : 'bg-white/5 border-white/10 hover:bg-white/10'}`}>{d.label}</button>
              ))}
            </div>
            {dayData.find(d => d.id === activeDay).events.map((ev, i) => (
              <div key={i} className={`p-8 rounded-[2rem] border ${ev.highlight ? 'border-orange-500 bg-orange-500/10' : 'border-white/10 bg-white/5 shadow-xl'}`}>
                <div className="text-orange-400 font-bold mb-1 tracking-widest uppercase text-xs">{ev.time}</div>
                <div className="text-2xl font-black leading-tight mb-4">{ev.title}</div>
                <div className="text-sm opacity-60 italic">{ev.presenters}</div>
              </div>
            ))}
          </Panel>

          <Panel title="Our Solutions" isOpen={activePanel === 'tech'}>
            {techData.map((t, i) => (
              <div key={i} className="glass-card p-8 rounded-[2rem] mb-6">
                <div className="flex justify-between items-start mb-2">
                  <div className="text-cyan-400 font-black text-3xl tracking-tighter uppercase">{t.name}</div>
                  <span className="text-[10px] font-bold px-3 py-1 bg-cyan-500/20 rounded-full border border-cyan-500/30 uppercase tracking-widest text-cyan-300">{t.status}</span>
                </div>
                <div className="font-bold mb-4 text-white/90 text-lg">{t.summary}</div>
                <p className="text-sm opacity-70 leading-relaxed max-w-2xl">{t.details}</p>
              </div>
            ))}
          </Panel>

          <Panel title="2026 Internships" isOpen={activePanel === 'intern'}>
            {internRoles.map((r, i) => (
              <div key={i} className="glass-card p-8 rounded-[2rem] mb-4 flex justify-between items-center">
                <div>
                  <div className="text-cyan-400 text-xs font-bold uppercase tracking-widest mb-1">{r.div}</div>
                  <div className="text-2xl font-black tracking-tight">{r.title}</div>
                </div>
                <div className="text-xs font-black px-5 py-2 bg-white/10 rounded-full uppercase tracking-tighter">{r.loc}</div>
              </div>
            ))}
          </Panel>
        </main>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
